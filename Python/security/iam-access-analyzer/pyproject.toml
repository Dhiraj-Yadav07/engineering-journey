[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "iam-access-analyzer"
version = "0.3.0"
description = "A simple IAM access analysis engine"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "pydantic==2.13.4",
    "uvicorn==0.52.4",
]

[tool.setuptools.packages.find]
where = ["src"]